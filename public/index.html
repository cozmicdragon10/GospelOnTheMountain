<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GospelOnTheMountain</title>
</head>
<body>
  <h1>GospelOnTheMountain Node server</h1>
  <p>Status: <span id="status">checking...</span></p>
  <img src="img/Evt1.jpg" alt="Evt1" style="max-width: 100%; height: auto;">
  <script>
    fetch("/api/health")
      .then((res) => res.json())
      .then((data) => { document.getElementById("status").textContent = data.status; })
      .catch(() => { document.getElementById("status").textContent = "unreachable"; });
  </script>
</body>
</html>
